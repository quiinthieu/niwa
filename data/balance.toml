# Tunable v1 balance parameters (PLAN §4).
# Every number in this file is a gameplay tunable, never a measured performance claim.

[garden]
# Initial plot capacity of a newly created garden (tunable; 3x3 starter grid).
default_plots = 9

[growth]
# Always-on wall-time trickle per 60s tick (tunable; tuned so a common plant blooms in ~1 work week).
base_gp_per_tick = 100
# Bonus GP per 60s tick when the tick is active (tunable).
sun_gp_per_tick = 150
# Default per-stage GP thresholds [Seed->Sprout, Sprout->Young, Young->Mature, Mature->Blooming] (tunable).
# Total = 720_000 GP = 7_200 base ticks = 5.0 days (120 hours) from wall-time trickle alone.
default_stage_thresholds = [40_000, 120_000, 220_000, 340_000]
# Default species growth multiplier (1.0 = neutral, tunable).
default_species_multiplier = 1.0
# Default season growth multiplier (1.0 = neutral, tunable).
default_season_multiplier = 1.0

[dormancy]
# Days without any active tick before plants pause in dormancy (tunable; PLAN §4.1 default = 7).
dormant_after_days = 7

[catch_up]
# Hours of consecutive offline ticks that count at full base trickle before tail scaling (tunable; PLAN §4.1 default = 72).
offline_cap_hours = 72
# Multiplier applied to base_gp_per_tick after offline_cap_hours until dormancy (tunable; 0.0..=1.0, PLAN §4.1).
offline_tail_factor = 0.5
# Maximum ticks simulated per bounded catch-up chunk (tunable; 1_440 = 1 day per chunk, PLAN §4.1).
chunk_ticks = 1_440

[seasons]
# Length of one season in days when season_mode = "garden" (tunable; PLAN §4.2).
season_length_days = 7
# Growth multiplier when current season is in a species' preferred_seasons (tunable; PLAN §4.2).
preferred_season_multiplier = 1.25
# Growth multiplier when current season is outside a species' preferred_seasons (tunable; PLAN §4.2).
off_season_multiplier = 0.85

[drops]
# Relative seed drop weights by rarity tier when harvesting a blooming plant (tunable; PLAN §4.2).
common_weight = 600
uncommon_weight = 270
rare_weight = 100
mythic_weight = 30
# Seasonal weight multipliers applied per candidate species in the drop table (tunable; PLAN §4.2).
in_season_weight_multiplier = 3
off_season_weight_multiplier = 1
# Number of seeds awarded per blooming harvest (tunable).
seeds_per_harvest = 2

[signals]
# Base water GP awarded per consented git commit before diminishing returns (tunable; PLAN §4.1).
commit_water_gp = 450
# Base water GP awarded per consented shell command by duration bucket before diminishing returns (tunable; PLAN §4.1 & §5).
shell_instant_water_gp = 8
shell_fast_water_gp = 40
shell_medium_water_gp = 90
shell_long_water_gp = 160
# Minimum seconds between water-awarding shell commands so rapid command loops grant 0 water (tunable; PLAN §4.1).
shell_min_spacing_secs = 5
# Half-life event count K for hourly diminishing returns: n-th water event scales by K / (K + n) (tunable; PLAN §4.1).
diminishing_half_life_events = 10
# Maximum total water GP awarded within any single UTC hour (tunable; PLAN §4.1 & T09).
hourly_water_cap_gp = 1_200
# Maximum total water GP awarded within any single UTC day (tunable; PLAN §4.1 & T09).
daily_water_cap_gp = 4_800
