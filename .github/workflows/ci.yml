name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust & Privacy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install shells for hook integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      - name: Install fish and xcodegen (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install fish
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run cargo-deny
        run: cargo deny check

      - name: Run privacy lint
        run: ./scripts/lint-privacy.sh

      - name: Run tg-core purity lint
        run: ./scripts/lint-core-purity.sh

      - name: Run PLAN.md §7 performance benchmark check
        env:
          NIWA_MACOS_BENCH_IDLE_SECS: "3.0"
        run: ./scripts/bench.sh

      - name: Build and test macOS menu bar app
        if: runner.os == 'macOS'
        run: |
          xcodegen generate --spec macos/Project.yml --project macos
          xcodebuild -project macos/TerminalGarden.xcodeproj -scheme TerminalGarden test
