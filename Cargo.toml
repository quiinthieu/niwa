[workspace]
members = [
    "crates/tg-core",
    "crates/tg-signals",
    "crates/tg-store",
    "crates/tg-render",
    "crates/niwa",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["quiinthieu"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/quiinthieu/niwa"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
tg-core = { path = "crates/tg-core" }
tg-signals = { path = "crates/tg-signals" }
tg-store = { path = "crates/tg-store" }
tg-render = { path = "crates/tg-render" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
directories = "6.0"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
proptest = { version = "1.6", default-features = false, features = ["std"] }
rand = { version = "0.9", default-features = false }
rand_pcg = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", default-features = false }
toml = "0.8"
assert_cmd = "2.0"
insta = "1.42"
tempfile = "3.17"
